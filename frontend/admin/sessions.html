<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Sessions — Placement Tracker</title>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🎓</div>
      <h2>Placement Tracker</h2>
      <p>Admin Portal</p>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Overview</span>
      <a href="dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
      <span class="nav-section-label">Management</span>
      <a href="students.html" class="nav-link"><span class="nav-icon">👥</span> Students</a>
      <a href="companies.html" class="nav-link"><span class="nav-icon">🏢</span> Companies</a>
      <a href="applications.html" class="nav-link"><span class="nav-icon">📋</span> Applications</a>
      <a href="sessions.html" class="nav-link active"><span class="nav-icon">📚</span> Sessions</a>
      <span class="nav-section-label">Insights</span>
      <a href="analytics.html" class="nav-link"><span class="nav-icon">📈</span> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar" id="sidebar-avatar">AD</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">Admin</div>
          <div class="user-role" id="sidebar-user-role">Admin</div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()" title="Logout">⏻</button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <h1>📚 Manage Sessions</h1>
        <p>Schedule training and interview prep sessions</p>
      </div>
      <button class="btn btn-primary" onclick="openSessionModal()">+ Add Session</button>
    </header>

    <div class="page-content animate-in">
      <div class="card">
        <div class="card-header">
          <h3>All Sessions</h3>
          <div class="search-box" style="max-width:300px;">
            <span class="search-icon">🔍</span>
            <input id="search-input" type="text" placeholder="Search sessions..." oninput="filterSessions()"/>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Category</th>
                <th>Trainer Name</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="sessions-tbody">
              <tr><td colspan="5" style="text-align:center;padding:40px;"><div class="loader"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Session Modal -->
<div class="modal-overlay" id="session-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Add Session</h3>
      <button class="modal-close" onclick="closeSessionModal()">✕</button>
    </div>
    <form id="session-form" onsubmit="saveSession(event)">
      <input type="hidden" id="session-id"/>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="sess-category" class="form-control" required>
          <option value="Aptitude">Aptitude</option>
          <option value="Coding">Coding</option>
          <option value="HR Interview">HR Interview</option>
          <option value="Technical Interview">Technical Interview</option>
          <option value="Group Discussion">Group Discussion</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Trainer Name</label>
        <input id="sess-trainer" type="text" class="form-control" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Session Date</label>
        <input id="sess-date" type="date" class="form-control" required/>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeSessionModal()">Cancel</button>
        <button type="submit" id="save-btn" class="btn btn-primary">💾 Save</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  requireRole('Admin');
  populateSidebar();

  let allSessions = [];

  async function loadSessions() {
    const res = await Sessions.getAll();
    if (res && res.ok) {
      allSessions = res.data.data || [];
      renderTable(allSessions);
    } else {
      showToast(res?.data?.message || 'Failed to load sessions.', 'error');
    }
  }

  function filterSessions() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = allSessions.filter(s =>
      s.category.toLowerCase().includes(q) ||
      s.trainerName.toLowerCase().includes(q)
    );
    renderTable(filtered);
  }

  function renderTable(sessions) {
    if (!sessions.length) {
      document.getElementById('sessions-tbody').innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📅</div><h3>No sessions found</h3></div></td></tr>`;
      return;
    }

    const now = new Date();
    document.getElementById('sessions-tbody').innerHTML = sessions.map(s => {
      const isPast = new Date(s.sessionDate) < now;
      return `
        <tr>
          <td><div style="font-weight:600;">${s.category}</div></td>
          <td>${s.trainerName}</td>
          <td>${formatDate(s.sessionDate)}</td>
          <td>${isPast ? '<span class="badge" style="background:var(--bg-secondary);">Past</span>' : '<span class="badge badge-applied">Upcoming</span>'}</td>
          <td>
            <button class="btn btn-sm btn-secondary" onclick='openSessionModal(${JSON.stringify(s).replace(/'/g, "&apos;")})'>✏️ Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteSession('${s.id}')">🗑️ Delete</button>
          </td>
        </tr>`;
    }).join('');
  }

  function openSessionModal(s = null) {
    document.getElementById('modal-title').textContent = s ? 'Edit Session' : 'Add Session';
    document.getElementById('session-id').value        = s ? s.id : '';
    document.getElementById('sess-category').value     = s ? s.category : 'Aptitude';
    document.getElementById('sess-trainer').value      = s ? s.trainerName : '';
    document.getElementById('sess-date').value         = s ? new Date(s.sessionDate).toISOString().split('T')[0] : '';
    document.getElementById('session-modal').classList.add('open');
  }

  function closeSessionModal() {
    document.getElementById('session-modal').classList.remove('open');
  }

  async function saveSession(e) {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    setLoading(btn, true);

    const id = document.getElementById('session-id').value;
    const body = {
      category:    document.getElementById('sess-category').value,
      trainerName: document.getElementById('sess-trainer').value.trim(),
      sessionDate: document.getElementById('sess-date').value,
    };

    const res = id ? await Sessions.update(id, body) : await Sessions.create(body);
    setLoading(btn, false);

    if (res && res.ok) {
      showToast(id ? 'Session updated!' : 'Session added!', 'success');
      closeSessionModal();
      loadSessions();
    } else {
      showToast(res?.data?.message || 'Error saving session', 'error');
    }
  }

  async function deleteSession(id) {
    if (!confirm('Are you sure you want to delete this session?')) return;
    const res = await Sessions.delete(id);
    if (res && res.ok) {
      showToast('Session deleted successfully', 'success');
      loadSessions();
    } else {
      showToast(res?.data?.message || 'Delete failed', 'error');
    }
  }

  loadSessions();
</script>
</body>
</html>
