<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Training Sessions — Placement Tracker</title>
  <meta name="description" content="View scheduled placement training sessions"/>
  <link rel="stylesheet" href="../css/styles.css"/>
  <style>
    .session-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:18px; }
    .session-card {
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:20px;
      transition:var(--transition);
    }
    .session-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--glass-border); }
    .session-card.past { opacity:0.6; }
    .category-icon {
      width:44px;height:44px;
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:1.2rem;
      background:rgba(99,120,255,0.15);
      flex-shrink:0;
    }
    .days-left {
      font-size:0.7rem; font-weight:700;
      padding:3px 9px; border-radius:100px;
    }
    .days-left.future { background:var(--info-bg); color:var(--info); }
    .days-left.today  { background:var(--success-bg); color:var(--success); }
    .days-left.past   { background:var(--bg-secondary); color:var(--text-muted); }
  </style>
</head>
<body>
<div id="toast-container" class="toast-container"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🎓</div>
      <h2>Placement Tracker</h2>
      <p>Student Portal</p>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Overview</span>
      <a href="dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
      <span class="nav-section-label">Placement</span>
      <a href="companies.html" class="nav-link"><span class="nav-icon">🏢</span> Companies</a>
      <a href="applications.html" class="nav-link"><span class="nav-icon">📋</span> My Applications</a>
      <span class="nav-section-label">Training</span>
      <a href="sessions.html" class="nav-link active"><span class="nav-icon">📚</span> Sessions</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar" id="sidebar-avatar">ST</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">Student</div>
          <div class="user-role" id="sidebar-user-role">Student</div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()" title="Logout">⏻</button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <h1>📚 Training Sessions</h1>
        <p>Upcoming placement preparation sessions</p>
      </div>
    </header>

    <div class="page-content animate-in">
      <div class="toolbar" style="margin-bottom:20px; display:flex; gap:16px; flex-wrap:wrap; justify-content:space-between;">
        <div class="search-box" style="flex:1; min-width:250px;">
          <span class="search-icon">🔍</span>
          <input id="search-input" type="text" placeholder="Search by category or trainer…" oninput="filterSessions()"/>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary" id="filter-all" style="background:var(--accent);color:#fff;border-color:var(--accent);" onclick="setFilter('all')">All Sessions</button>
          <button class="btn btn-secondary" id="filter-selected" onclick="setFilter('selected')">⭐ Selected Sessions</button>
        </div>
      </div>

      <div class="session-grid" id="sessions-grid">
        <div style="grid-column:1/-1;" class="page-loader"><div class="loader"></div></div>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
  requireRole('Student');
  populateSidebar();

  let allSessions = [];
  let selectedIds = new Set();
  let activeFilter = 'all';

  const categoryIcons = {
    Aptitude: '🧮', Coding: '💻', 'HR Interview': '🤝',
    'Group Discussion': '🗣️', 'Technical Interview': '⚙️',
  };

  async function loadSessions() {
    const [allRes, selRes] = await Promise.all([
      Sessions.getAll(),
      Sessions.getSelected()
    ]);

    if (!allRes || !allRes.ok) {
      showToast('Failed to load sessions.', 'error');
      return;
    }
    allSessions = allRes.data.data || [];
    if (selRes && selRes.ok) {
      // FIX: normalise to strings — API returns number ids, onclick passes strings
      selectedIds = new Set((selRes.data.data || []).map(s => String(s.id)));
    }
    filterSessions();
  }

  function setFilter(f) {
    activeFilter = f;
    const btnAll = document.getElementById('filter-all');
    const btnSel = document.getElementById('filter-selected');
    btnAll.style.background = 'transparent'; btnAll.style.color = 'var(--text-secondary)'; btnAll.style.borderColor = 'var(--border)';
    btnSel.style.background = 'transparent'; btnSel.style.color = 'var(--text-secondary)'; btnSel.style.borderColor = 'var(--border)';

    const activeBtn = f === 'all' ? btnAll : btnSel;
    activeBtn.style.background = 'var(--accent)';
    activeBtn.style.color = '#fff';
    activeBtn.style.borderColor = 'var(--accent)';
    filterSessions();
  }

  function filterSessions() {
    const q = document.getElementById('search-input').value.toLowerCase();
    let list = allSessions;
    // FIX: compare with string ids consistently
    if (activeFilter === 'selected') list = list.filter(s => selectedIds.has(String(s.id)));
    if (q) list = list.filter(s =>
      s.category.toLowerCase().includes(q) ||
      s.trainerName.toLowerCase().includes(q)
    );
    renderGrid(list);
  }

  async function toggleBookmark(id) {
    // id arrives as a string from onclick — keep as string for Set consistency
    const sid = String(id);
    const isSelected = selectedIds.has(sid);
    const res = isSelected ? await Sessions.unselect(sid) : await Sessions.select(sid);
    if (!res || !res.ok) {
      showToast(res?.data?.message || 'Action failed.', 'error');
      return;
    }
    if (isSelected) {
      selectedIds.delete(sid);
      showToast('Session removed from selected.', 'info');
    } else {
      selectedIds.add(sid);
      showToast('Session added to selected! ⭐', 'success');
    }
    filterSessions();
  }

  function renderGrid(sessions) {
    if (!sessions.length) {
      document.getElementById('sessions-grid').innerHTML = `
        <div style="grid-column:1/-1;"><div class="empty-state">
          <div class="empty-icon">📅</div>
          <h3>No sessions found</h3>
        </div></div>`;
      return;
    }

    const now = new Date();
    document.getElementById('sessions-grid').innerHTML = sessions.map(s => {
      const date = new Date(s.sessionDate);
      const diffMs   = date - now;
      const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      const isPast   = diffDays < 0;
      const isToday  = diffDays === 0;

      let daysLabel, daysClass;
      if (isPast)        { daysLabel = 'Completed'; daysClass = 'past'; }
      else if (isToday)  { daysLabel = 'TODAY';     daysClass = 'today'; }
      else               { daysLabel = `In ${diffDays}d`;  daysClass = 'future'; }

      const icon = categoryIcons[s.category] || '📋';
      const isSelected = selectedIds.has(String(s.id));

      return `
        <div class="session-card ${isPast ? 'past' : ''}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;">
            <div class="category-icon">${icon}</div>
            <div style="display:flex;gap:8px;align-items:center;">
              <span class="days-left ${daysClass}">${daysLabel}</span>
              <button onclick="toggleBookmark('${s.id}')" style="background:none;border:none;cursor:pointer;font-size:1.2rem;transition:var(--transition);filter:${isSelected ? 'none' : 'grayscale(100%) opacity(0.3)'}">⭐</button>
            </div>
          </div>
          <div style="font-size:1.05rem;font-weight:700;margin-bottom:6px;">${s.category}</div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:4px;">👨‍🏫 ${s.trainerName}</div>
          <div style="font-size:0.8rem;color:var(--text-muted);">📅 ${formatDate(s.sessionDate)}</div>
        </div>`;
    }).join('');
  }

  loadSessions();
</script>
</body>
</html>
